{% extends 'layout/layout_vertical.html' %}
{% load static %}

{% block title %}案例解释 - 学测工坊{% endblock %}

{% block content %}
<div class="row">
  <div class="col-12">
    <nav aria-label="breadcrumb">
      <ol class="breadcrumb">
        <li class="breadcrumb-item"><a href="/api_management/">接口文档</a></li>
        <li class="breadcrumb-item active">案例解释</li>
      </ol>
    </nav>

    <div class="card">
      <div class="card-body">
        <h4 class="card-title mb-3"><i class="ri ri-file-code-line me-2"></i>案例解释</h4>
        <p class="text-muted">以下是对 <code>script.py</code> 中 API 配置及 JSON 文件相关代码的详细说明：</p>
        <hr>
        <div class="script-explanation">
          {{ script_explanation_html|safe }}
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}

{% block page_js %}
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github.min.css">
<style>
.script-explanation h2 { font-size:1.25rem; margin-top:1.5rem; margin-bottom:0.75rem; }
.script-explanation h3 { font-size:1.1rem; margin-top:1.25rem; margin-bottom:0.5rem; }
.script-explanation h4 { font-size:1rem; margin-top:1rem; margin-bottom:0.5rem; }
.script-explanation table { width:100%; margin-bottom:1rem; border-collapse:collapse; }
.script-explanation table th,
.script-explanation table td { border:1px solid #dee2e6; padding:0.5rem; }
.script-explanation table th { background:#f8f9fa; }
.script-explanation pre { background:#f6f8fa; padding:0.75rem; border-radius:0.375rem; overflow-x:auto; font-size:0.85rem; border:1px solid #e1e4e8; }
.script-explanation code { font-size:0.85rem; }
.script-explanation hr { margin:1.5rem 0; }
.script-explanation pre code.hljs { background:transparent; padding:0; }
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/python.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/json.min.js"></script>
<script>hljs.highlightAll();</script>
{% endblock %}
