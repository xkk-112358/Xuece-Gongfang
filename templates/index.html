{% extends "_base.html" %}
{% load static %}

{% block content %}
    <div class="min-vh-100" style="background: linear-gradient(135deg, #f0fdf4, #d1fae5); width: 100vw; margin-left: calc(-50vw + 50%); margin-right: calc(-50vw + 50%); margin-top: -1.5rem; padding: 2rem 1rem;">
        <div class="d-flex align-items-center justify-content-center" style="min-height: calc(100vh - 4rem);">
        <div class="max-w-6xl w-full flex flex-col lg:flex-row items-center gap-12">
            <div class="lg:w-1/2 text-center lg:text-left">
                <h1 class="text-4xl lg:text-5xl font-bold text-gray-900 mb-6">
                    欢迎来到 <span class="text-green-600">学测工坊</span>
                </h1>
                <p class="text-lg text-gray-600 mb-8">
                    专业的在线学习与测评平台，助力您的学习成长之路。
                </p>
                <div class="grid grid-cols-2 gap-4">
                    <div class="bg-white rounded-lg shadow-md p-4 text-center">
                        <div class="w-12 h-12 bg-blue-100 rounded-full flex items-center justify-center mx-auto mb-3">
                            <svg class="w-6 h-6 text-blue-600" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"></path>
                            </svg>
                        </div>
                        <p class="text-sm font-medium text-gray-900">题库导入</p>
                        <p class="text-xs text-gray-500 mt-1">Word/PDF题库一键导入</p>
                    </div>
                    <div class="bg-white rounded-lg shadow-md p-4 text-center">
                        <div class="w-12 h-12 bg-green-100 rounded-full flex items-center justify-center mx-auto mb-3">
                            <svg class="w-6 h-6 text-green-600" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 7h6m0 10v-3m-3 3h.01M9 17h.01M9 14h.01M12 14h.01M15 11h.01M12 11h.01M9 11h.01M7 21h10a2 2 0 002-2V5a2 2 0 00-2-2H7a2 2 0 00-2 2v14a2 2 0 002 2z"></path>
                            </svg>
                        </div>
                        <p class="text-sm font-medium text-gray-900">智能刷题</p>
                        <p class="text-xs text-gray-500 mt-1">个性化练习，高效刷题</p>
                    </div>
                    <div class="bg-white rounded-lg shadow-md p-4 text-center">
                        <div class="w-12 h-12 bg-purple-100 rounded-full flex items-center justify-center mx-auto mb-3">
                            <svg class="w-6 h-6 text-purple-600" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"></path>
                            </svg>
                        </div>
                        <p class="text-sm font-medium text-gray-900">自动判分</p>
                        <p class="text-xs text-gray-500 mt-1">即时反馈，快速纠错</p>
                    </div>
                    <div class="bg-white rounded-lg shadow-md p-4 text-center">
                        <div class="w-12 h-12 bg-orange-100 rounded-full flex items-center justify-center mx-auto mb-3">
                            <svg class="w-6 h-6 text-orange-600" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path>
                            </svg>
                        </div>
                        <p class="text-sm font-medium text-gray-900">高效备考</p>
                        <p class="text-xs text-gray-500 mt-1">数据统计，精准分析</p>
                    </div>
                </div>
            </div>

            <div class="lg:w-1/2 w-full max-w-md">
                <div class="bg-white rounded-2xl shadow-xl p-8">
                    <div class="flex mb-6">
                        <button id="login-tab" class="flex-1 py-3 px-4 text-center font-semibold rounded-t-lg transition-all duration-200 {% if active_tab != 'register' %}bg-green-600 text-white{% else %}bg-gray-100 text-gray-600 hover:bg-gray-200{% endif %}">
                            登录
                        </button>
                        <button id="register-tab" class="flex-1 py-3 px-4 text-center font-semibold rounded-t-lg transition-all duration-200 {% if active_tab == 'register' %}bg-green-600 text-white{% else %}bg-gray-100 text-gray-600 hover:bg-gray-200{% endif %}">
                            注册
                        </button>
                    </div>

                    {% if message %}
                    <div id="error-message" class="mb-4 p-4 bg-red-50 border border-red-200 rounded-lg shadow-sm">
                        <div class="flex items-center">
                            <svg class="w-5 h-5 text-red-600 mr-3 flex-shrink-0" viewBox="0 0 20 20">
                                <path fill-rule="evenodd" d="M8.257 3.099c.765-1.36 2.722-1.36 3.486 0l5.58 9.92c.75 1.334-.213 2.98-1.742 2.98H4.42c-1.53 0-2.493-1.646-1.743-2.98l5.58-9.92zM11 13a1 1 0 11-2 0 1 1 0 012 0zm-1-8a1 1 0 00-1 1v3a1 1 0 002 0V6a1 1 0 00-1-1z" clip-rule="evenodd"></path>
                            </svg>
                            <p class="text-sm font-medium text-red-700">{{ message }}</p>
                        </div>
                    </div>
                    {% endif %}

                    <form id="login-form" class="space-y-6 {% if active_tab == 'register' %}hidden{% endif %}" method="POST" action="{% url 'login' %}">
                        {% csrf_token %}
                        <input type="hidden" name="next" value="{{ next_url }}">
                        <div>
                            <label for="login-username" class="block text-sm font-medium text-gray-700 mb-2">昵称</label>
                            <input type="text" id="login-username" name="username" class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-green-500 focus:border-transparent transition-all duration-200" placeholder="请输入昵称">
                        </div>
                        <div>
                            <label for="login-password" class="block text-sm font-medium text-gray-700 mb-2">密码</label>
                            <input type="password" id="login-password" name="password" class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-green-500 focus:border-transparent transition-all duration-200" placeholder="请输入密码">
                        </div>
                        <button type="submit" class="w-full py-3 px-4 bg-green-600 text-white font-semibold rounded-lg hover:bg-green-700 focus:ring-2 focus:ring-green-500 focus:ring-offset-2 transition-all duration-200">
                            登录
                        </button>
                    </form>

                    <form id="register-form" class="space-y-6 {% if active_tab != 'register' %}hidden{% endif %}" method="POST" action="{% url 'register' %}">
                        {% csrf_token %}
                        <input type="hidden" name="next" value="{{ next_url }}">
                        <div>
                            <label for="register-name" class="block text-sm font-medium text-gray-700 mb-2">昵称</label>
                            <input type="text" id="register-name" name="username" value="{{ register_username|default:'' }}" class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-green-500 focus:border-transparent transition-all duration-200" placeholder="请输入昵称">
                        </div>
                        <div>
                            <label for="register-password" class="block text-sm font-medium text-gray-700 mb-2">密码</label>
                            <input type="password" id="register-password" name="password" class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-green-500 focus:border-transparent transition-all duration-200" placeholder="请输入密码（8-16位，含大小写字母+数字）">
                        </div>
                        <div>
                            <label for="register-confirm-password" class="block text-sm font-medium text-gray-700 mb-2">确认密码</label>
                            <input type="password" id="register-confirm-password" name="confirm_password" class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-green-500 focus:border-transparent transition-all duration-200" placeholder="请再次输入密码">
                        </div>
                        <button type="submit" class="w-full py-3 px-4 bg-green-600 text-white font-semibold rounded-lg hover:bg-green-700 focus:ring-2 focus:ring-green-500 focus:ring-offset-2 transition-all duration-200">
                            注册
                        </button>
                    </form>
                </div>

                <script>
                    function hideErrorMessage() {
                        var errorMessage = document.getElementById('error-message');
                        if (errorMessage) {
                            errorMessage.style.display = 'none';
                        }
                    }

                    document.getElementById('login-tab').addEventListener('click', function() {
                        document.getElementById('login-tab').classList.add('bg-green-600', 'text-white');
                        document.getElementById('login-tab').classList.remove('bg-gray-100', 'text-gray-600');
                        document.getElementById('register-tab').classList.remove('bg-green-600', 'text-white');
                        document.getElementById('register-tab').classList.add('bg-gray-100', 'text-gray-600');
                        document.getElementById('login-form').classList.remove('hidden');
                        document.getElementById('register-form').classList.add('hidden');
                    });

                    document.getElementById('register-tab').addEventListener('click', function() {
                        document.getElementById('register-tab').classList.add('bg-green-600', 'text-white');
                        document.getElementById('register-tab').classList.remove('bg-gray-100', 'text-gray-600');
                        document.getElementById('login-tab').classList.remove('bg-green-600', 'text-white');
                        document.getElementById('login-tab').classList.add('bg-gray-100', 'text-gray-600');
                        document.getElementById('register-form').classList.remove('hidden');
                        document.getElementById('login-form').classList.add('hidden');
                        hideErrorMessage();
                    });
                </script>
            </div>
        </div>
    </div>
    </div>
{% endblock content %}
