{% load compress %}
{% load static %}

<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>学测工坊</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Remix Icons -->
    <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">

    {% compress css %}
    <link rel="stylesheet" href="{% static 'src/output.css' %}">
    {% endcompress %}

    <style>
        #typeText {
            color: #007bff;
            font-size: 18px;
            font-weight: bold;
            white-space: nowrap;
        }

        #typeText::after {
            content: "_";
            animation: blink 1s infinite;
            color: inherit;
        }

        @keyframes blink {
            50% { opacity: 0; }
        }

        .custom-alert .alert-close svg {
            width: 12px;
            height: 12px;
        }

        @keyframes slideIn {
            from {
                transform: translateX(100%);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        @keyframes progress {
            from {
                width: 100%;
            }
            to {
                width: 0;
            }
        }
    </style>
</head>

<body class="bg-green-50">
    <nav class="bg-green-50 border-gray-200 px-2 sm:px-4 py-2.5 rounded-sm dark:bg-gray-800">
        <div class="container flex flex-wrap items-center justify-between mx-auto">
            <a href="#" class="flex items-center gap-2">
                <img src="{% static 'pictures/logo.jpg' %}" alt="学测工坊 Logo" class="h-8 w-8 rounded-lg">
                <span class="self-center text-xl font-semibold whitespace-nowrap dark:text-white">学测工坊</span>
            </a>
            
            <div class="hidden md:flex items-center flex-1 justify-center mx-8">
                <div id="typeText"></div>
            </div>
            
            <button data-collapse-toggle="mobile-menu" type="button" class="inline-flex items-center p-2 ml-3 text-sm text-gray-500 rounded-lg md:hidden hover:bg-gray-100 focus:outline-none focus:ring-2 focus:ring-gray-200 dark:text-gray-400 dark:hover:bg-gray-700 dark:focus:ring-gray-600" aria-controls="mobile-menu" aria-expanded="false">
                <span class="sr-only">Open main menu</span>
                <svg class="w-6 h-6" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg"><path fill-rule="evenodd" d="M3 5a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1zM3 10a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1zM3 15a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1z" clip-rule="evenodd"></path></svg>
                <svg class="hidden w-6 h-6" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg"><path fill-rule="evenodd" d="M4.293 4.293a1 1 0 011.414 0L10 8.586l4.293-4.293a1 1 0 111.414 1.414L11.414 10l4.293 4.293a1 1 0 01-1.414 1.414L10 11.414l-4.293 4.293a1 1 0 01-1.414-1.414L8.586 10 4.293 5.707a1 1 0 010-1.414z" clip-rule="evenodd"></path></svg>
            </button>
            <div class="hidden w-full md:block md:w-auto" id="mobile-menu">
                <ul class="flex flex-col mt-4 md:flex-row md:space-x-8 md:mt-0 md:text-sm md:font-medium">
                    <li>
                        <a href="/home/{% if user.is_authenticated %}?user_id={{ encrypted_user_id }}{% endif %}" class="block py-2 pl-3 pr-4 text-white bg-green-700 rounded-sm md:bg-transparent md:text-green-700 md:p-0 dark:text-white" aria-current="page">主页</a>
                    </li>
                    <li>
                        <a href="/about/{% if user.is_authenticated %}?user_id={{ encrypted_user_id }}{% endif %}" {% if not user.is_authenticated %}onclick="return requireLogin()"{% endif %} class="block py-2 pl-3 pr-4 text-gray-600 border-b border-gray-100 hover:bg-gray-50 md:hover:bg-transparent md:border-0 md:hover:text-green-700 md:p-0 dark:text-gray-400 md:dark:hover:text-white dark:hover:bg-gray-700 dark:hover:text-white md:dark:hover:bg-transparent dark:border-gray-700">关于</a>
                    </li>
                    <li>
                        <a href="/price/{% if user.is_authenticated %}?user_id={{ encrypted_user_id }}{% endif %}" {% if not user.is_authenticated %}onclick="return requireLogin()"{% endif %} class="block py-2 pl-3 pr-4 text-gray-600 border-b border-gray-100 hover:bg-gray-50 md:hover:bg-transparent md:border-0 md:hover:text-green-700 md:p-0 dark:text-gray-400 md:dark:hover:text-white dark:hover:bg-gray-700 dark:hover:text-white md:dark:hover:bg-transparent dark:border-gray-700">价格</a>
                    </li>
                    <li>
                        <a href="/contact/{% if user.is_authenticated %}?user_id={{ encrypted_user_id }}{% endif %}" {% if not user.is_authenticated %}onclick="return requireLogin()"{% endif %} class="block py-2 pl-3 pr-4 text-gray-600 border-b hover:bg-gray-50 md:hover:bg-transparent md:border-0 md:hover:text-green-700 md:p-0 dark:text-gray-400 md:dark:hover:text-white dark:hover:bg-gray-700 dark:hover:text-white md:dark:hover:bg-transparent">联系我们</a>
                    </li>
                    <li>
                        <a href="/my/{% if user.is_authenticated %}?user_id={{ encrypted_user_id }}{% endif %}" {% if not user.is_authenticated %}onclick="return requireLogin()"{% endif %} class="block py-2 pl-3 pr-4 text-gray-600 border-gray-100 hover:bg-gray-50 md:hover:bg-transparent md:border-0 md:hover:text-green-700 md:p-0 dark:text-gray-400 md:dark:hover:text-white dark:hover:bg-gray-700 dark:hover:text-white md:dark:hover:bg-transparent dark:border-gray-700">我的{% if unread_notification_count > 0 %} <span class="inline-block w-2 h-2 bg-red-500 rounded-full" style="background-color:red;width:8px;height:8px;border-radius:50%;display:inline-block;vertical-align:super;"></span>{% endif %}</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container mx-auto mt-4">
        {% block content %}
        {% endblock content %}
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/flowbite@4.0.1/dist/flowbite.min.js"></script>

<script>
    function requireLogin() {
        alert('请先注册或登录后再访问此页面');
        window.location.href = '/login/';
        return false;
    }

    document.addEventListener('DOMContentLoaded', function() {
        {% if messages %}
            {% for message in messages %}
                showAlert("{{ message|escapejs }}");
            {% endfor %}
        {% endif %}
    });

    function showAlert(message) {
        var alertContainer = document.createElement('div');
        alertContainer.className = 'custom-alert';
        alertContainer.innerHTML = `
            <div class="alert-icon">
                <svg viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path d="M20 6L9 17l-5-5" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
            </div>
            <div class="alert-content">${message}</div>
            <div class="alert-close" onclick="this.parentElement.remove()">
                <svg viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path d="M6 18L18 6M6 6l12 12" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
            </div>
            <div class="alert-progress"></div>
        `;
        document.body.appendChild(alertContainer);

        setTimeout(function() {
            if (alertContainer.parentNode) {
                alertContainer.style.animation = 'slideIn 0.3s ease-out reverse';
                setTimeout(function() {
                    alertContainer.remove();
                }, 300);
            }
        }, 5000);
    }
</script>
</body>

</html>
